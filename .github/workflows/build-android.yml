name: build-android

# 拆分自 build-all-formats.yml —— 仅打包 Android APK, 不再拖 windows / macos / ios 一起跑。
# 用途: 日常 OTA 客户端迭代(只动 androidApp), 减少 30+ 分钟的全平台 matrix 时间。
#
# 触发方式:
#   1) workflow_dispatch 手动 Run workflow 按钮(可填 version + skip_release)
#   2) push 到 ci/build-android/** 临时分支(批量调试时用, 用完即删)
#
# 如未来需要 tag 触发, 在此 on: 下追加 push: tags: ['mobile-v*'] 即可。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号, 如 0.4.0(仅 release 流程时填; 调试构建可留空)'
        required: false
        type: string
        default: ''
      skip_release:
        description: '跳过 GitHub Release 发布(只调试构建时勾选)'
        required: false
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - ci/build-android/**

jobs:
  build-android:
    name: android-apk
    # 取消 matrix: 此 workflow 只跑 android, 直接 runs-on ubuntu-22.04 即可。
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        # mobile 工程在仓库内 mobius/mobile/ 子目录(仓库根对应整个 /app 而非 mobius/)。
        # 所有 ./gradlew、androidApp/、shared/ 相对路径均以 mobius/mobile 为基准。
        working-directory: mobius/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision Android release keystore (optional)
        env:
          MOMO_ANDROID_KEYSTORE_B64: ${{ secrets.MOMO_ANDROID_KEYSTORE_B64 }}
          MOMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOMO_ANDROID_KEYSTORE_PASSWORD }}
          MOMO_ANDROID_KEY_ALIAS: ${{ secrets.MOMO_ANDROID_KEY_ALIAS }}
          MOMO_ANDROID_KEY_PASSWORD: ${{ secrets.MOMO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 仅当 4 个 secret 全部配置时才启用 release 签名;
          # 任一缺失则降级为 debug 签名(Gradle 自动从 signingConfigs.debug 读取),
          # 避免阻塞现有的 CI 流程。
          if [ -z "$MOMO_ANDROID_KEYSTORE_B64" ] \
             || [ -z "$MOMO_ANDROID_KEYSTORE_PASSWORD" ] \
             || [ -z "$MOMO_ANDROID_KEY_ALIAS" ] \
             || [ -z "$MOMO_ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::MOMO_ANDROID_KEYSTORE_* secrets not fully configured; falling back to debug signing for this run."
            exit 0
          fi
          echo "$MOMO_ANDROID_KEYSTORE_B64" | base64 -d > /tmp/mobius-release.keystore
          ls -la /tmp/mobius-release.keystore
          echo "MOMO_ANDROID_KEYSTORE_PATH=/tmp/mobius-release.keystore" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEYSTORE_PASSWORD=$MOMO_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEY_ALIAS=$MOMO_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEY_PASSWORD=$MOMO_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Release keystore provisioned; signingConfig.release will be activated by Gradle."

      - name: Build Android APK
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Compute SHA-256 and stage artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp androidApp/build/outputs/apk/release/*.apk artifacts/
          ( cd artifacts && sha256sum * > sha256.txt )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # uses: step 不受 defaults.run.working-directory 影响, path 必须写全
          # 相对仓库根的路径, 否则 if-no-files-found: error 会让 job 在上传步骤失败。
          path: mobius/mobile/artifacts/
          if-no-files-found: error

  # 构建成功后, 把 artifact 发布为 GitHub Release (pre-release)。
  # Release asset 匿名可下载, 供服务器侧 sync-mobile-builds 与用户直链分发;
  # 本机无 GitHub PAT 时这是唯一能把 CI 产物取下来的通道。
  # 默认每次都发布; 调试时可手 dispatch 时勾选 skip_release=true 跳过此 job。
  release:
    name: Publish Android APK to GitHub Release
    needs: build-android
    if: success() && inputs.skip_release != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Resolve version (workflow input overrides build.gradle.kts)
        id: ver
        run: |
          set -euo pipefail
          # 优先用 workflow_dispatch 输入的 version(发布正式版时人工指定);
          # 留空则从 androidApp/build.gradle.kts 读 versionName, 便于日常调试也走同一发布路径。
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          else
            VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobius/mobile/androidApp/build.gradle.kts | head -1)"
          fi
          echo "version: $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Stage release files (rename to distribution names)
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p release
          # Android splits-abi APK → mobius-mobile-<ver>-android-<abi>.apk 分发名 (与 0.1.19 对齐)
          for apk in all-artifacts/android-apk/*.apk; do
            base="$(basename "$apk" .apk)"
            case "$base" in
              *arm64*)  cp "$apk" "release/mobius-mobile-${VER}-android-arm64.apk" ;;
              *v7a*)    cp "$apk" "release/mobius-mobile-${VER}-android-armeabi-v7a.apk" ;;
              *)        cp "$apk" "release/${base}-${VER}.apk" ;;
            esac
          done
          ( cd release && sha256sum * > sha256.txt )
          ls -la release/

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.ver.outputs.ver }}
          name: Mobius Mobile v${{ steps.ver.outputs.ver }} (CI build)
          prerelease: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}