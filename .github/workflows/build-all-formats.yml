name: build-all-formats

on:
  # 仅手动触发(build-all-formats 在 main 上长期失败, 避免 push 即跑出失败 run)。
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: android-apk
            artifact: android-apk
          - os: windows-2022
            target: windows-exe
            artifact: windows-exe
          - os: macos-14
            target: ios-simulator-app
            artifact: ios-simulator-app
          - os: macos-14
            target: macos-dmg
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        # mobile 工程在仓库内 mobius/mobile/ 子目录(仓库根对应整个 /app 而非 mobius/)。
        # 所有 ./gradlew、iosApp/、shared/、androidApp/ 相对路径均以 mobius/mobile 为基准。
        working-directory: mobius/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision Android release keystore (optional)
        if: matrix.target == 'android-apk'
        env:
          MOMO_ANDROID_KEYSTORE_B64: ${{ secrets.MOMO_ANDROID_KEYSTORE_B64 }}
          MOMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOMO_ANDROID_KEYSTORE_PASSWORD }}
          MOMO_ANDROID_KEY_ALIAS: ${{ secrets.MOMO_ANDROID_KEY_ALIAS }}
          MOMO_ANDROID_KEY_PASSWORD: ${{ secrets.MOMO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 仅当 4 个 secret 全部配置时才启用 release 签名;
          # 任一缺失则降级为 debug 签名(Gradle 自动从 signingConfigs.debug 读取),
          # 避免阻塞现有的 CI 流程。
          if [ -z "$MOMO_ANDROID_KEYSTORE_B64" ] \
             || [ -z "$MOMO_ANDROID_KEYSTORE_PASSWORD" ] \
             || [ -z "$MOMO_ANDROID_KEY_ALIAS" ] \
             || [ -z "$MOMO_ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::MOMO_ANDROID_KEYSTORE_* secrets not fully configured; falling back to debug signing for this run."
            exit 0
          fi
          echo "$MOMO_ANDROID_KEYSTORE_B64" | base64 -d > /tmp/mobius-release.keystore
          ls -la /tmp/mobius-release.keystore
          echo "MOMO_ANDROID_KEYSTORE_PATH=/tmp/mobius-release.keystore" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEYSTORE_PASSWORD=$MOMO_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEY_ALIAS=$MOMO_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MOMO_ANDROID_KEY_PASSWORD=$MOMO_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Release keystore provisioned; signingConfig.release will be activated by Gradle."

      - name: Build Android APK
        if: matrix.target == 'android-apk'
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Build Windows EXE
        if: matrix.target == 'windows-exe'
        run: ./gradlew --no-daemon :desktopApp:packageExe

      - name: Print jpackage error log on Windows failure
        if: matrix.target == 'windows-exe' && failure()
        run: |
          for f in desktopApp/build/compose/logs/packageExe/*-err.txt desktopApp/build/compose/logs/packageExe/*-out.txt; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done

      - name: Build macOS DMG
        if: matrix.target == 'macos-dmg'
        run: ./gradlew --no-daemon :desktopApp:packageDmg

      - name: Select latest Xcode (iOS)
        if: matrix.target == 'ios-simulator-app'
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen (iOS)
        if: matrix.target == 'ios-simulator-app'
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Link iOS framework and generate Xcode project
        if: matrix.target == 'ios-simulator-app'
        run: |
          ./gradlew --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64
          mkdir -p iosApp/Frameworks
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/MomoShared.framework iosApp/Frameworks/
          cd iosApp && xcodegen generate

      - name: Build iOS Simulator .app
        if: matrix.target == 'ios-simulator-app'
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS=x86_64 \
            build

      - name: Compute SHA-256 and stage artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "${{ matrix.target }}" in
            android-apk)
              cp androidApp/build/outputs/apk/release/*.apk artifacts/
              ;;
            windows-exe)
              cp desktopApp/build/compose/binaries/main/exe/*.exe artifacts/
              ;;
            macos-dmg)
              STAMP="$(date -u +%Y%m%d-%H%M)"
              src="$(ls desktopApp/build/compose/binaries/main/dmg/*.dmg | head -1)"
              base="$(basename "$src" .dmg)"
              cp "$src" "artifacts/${base}-${STAMP}.dmg"
              ;;
            ios-simulator-app)
              # .app is a directory; zip it for artifact upload
              # (artifacts/ 建在 working-directory 即 mobius/mobile/ 下, 不能再用
              #  $GITHUB_WORKSPACE 绝对路径——那指向仓库根, 目录不存在会导致 zip 失败)
              ( cd iosApp/build/Build/Products/Debug-iphonesimulator && \
                zip -qry "$PWD/../../../../../artifacts/iosApp.zip" *.app )
              ;;
          esac
          # Linux has sha256sum; macOS only has shasum.
          HASH_CMD="sha256sum"
          command -v "$HASH_CMD" >/dev/null 2>&1 || HASH_CMD="shasum -a 256"
          ( cd artifacts && $HASH_CMD * > sha256.txt )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # uses: step 不受 defaults.run.working-directory 影响, path 必须写全
          # 相对仓库根的路径, 否则 if-no-files-found: error 会让所有 job 在上传步骤失败。
          path: mobius/mobile/artifacts/
          if-no-files-found: error

  # 4 平台全部成功后, 把 artifacts 发布为 GitHub Release (pre-release)。
  # Release asset 匿名可下载, 供服务器侧 sync-mobile-builds 与用户直链分发;
  # 本机无 GitHub PAT 时这是唯一能把 CI 产物取下来的通道。
  release:
    name: Publish artifacts to GitHub Release
    needs: build
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Stage release files (rename to distribution names)
        id: ver
        run: |
          set -euo pipefail
          VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobius/mobile/androidApp/build.gradle.kts | head -1)"
          echo "version: $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p release
          # Android splits-abi APK → mobius-mobile-<ver>-android-<abi>.apk 分发名 (与 0.1.19 对齐)
          for apk in all-artifacts/android-apk/*.apk; do
            base="$(basename "$apk" .apk)"
            case "$base" in
              *arm64*)  cp "$apk" "release/mobius-mobile-${VER}-android-arm64.apk" ;;
              *v7a*)    cp "$apk" "release/mobius-mobile-${VER}-android-armeabi-v7a.apk" ;;
              *)        cp "$apk" "release/${base}-${VER}.apk" ;;
            esac
          done
          # 其余平台产物原样分发
          find all-artifacts/windows-exe -name '*.exe' -exec cp {} release/ \; 2>/dev/null || true
          find all-artifacts/macos-dmg -name '*.dmg' -exec cp {} release/ \; 2>/dev/null || true
          [ -d all-artifacts/ios-simulator-app ] && cp all-artifacts/ios-simulator-app/iosApp.zip "release/mobius-mobile-${VER}-ios-simulator-app.zip" || true
          ( cd release && sha256sum * > sha256.txt )
          ls -la release/

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.ver.outputs.ver }}
          name: Mobius Mobile v${{ steps.ver.outputs.ver }} (CI build)
          prerelease: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
